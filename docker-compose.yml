services:
  db:
    image: postgres:16-alpine
    container_name: digital_order_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-digital_order_management_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgresspass}
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-digital_order_management_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: digital_order_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
